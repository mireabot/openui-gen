included:
  - OpenUIGen
  - OpenUIGenTests

excluded:
  - .build
  - build
  - DerivedData

disabled_rules:
  - todo
  - trailing_comma

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - empty_count
  - empty_string
  - first_where
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

analyzer_rules:
  - unused_import

unused_import:
  always_keep_imports:
    - Foundation
    - SwiftUI

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 900

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 60
  error: 120

identifier_name:
  min_length: 2
  excluded: [id, ui, x, y, z, to, at]

type_name:
  min_length: 3

# SwiftFormat (wrapMultilineStatementBraces) puts the brace of a multi-line condition on its own line.
opening_brace:
  ignore_multiline_statement_conditions: true
